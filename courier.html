<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kuryer Çatdırılma Portalı | Baku Lounge</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #131b2e;
            --bg-card-subtle: #1c2742;
            --border: #233152;
            --border-light: #334673;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gold: #fbbf24;
            --sky: #38bdf8;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 30px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 19, 33, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
        }

        .brand-text h1 {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            line-height: 1.2;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--sky);
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }

        .switch-link-btn {
            text-decoration: none;
            padding: 7px 12px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 10px;
            color: #34d399;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .switch-link-btn:active {
            transform: scale(0.96);
            background: rgba(16, 185, 129, 0.25);
        }

        main {
            padding: 14px 16px;
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* CONTROLS CARD */
        .courier-controls-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--shadow);
        }

        .control-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .courier-select {
            flex: 1;
            background: #0d1527;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            color: #fff;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 700;
            outline: none;
        }

        .btn-refresh {
            background: var(--bg-card-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-refresh:active {
            background: var(--border);
        }

        .quick-confirm-bar {
            display: flex;
            gap: 8px;
        }

        .quick-input {
            flex: 1;
            background: #090e1a;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: var(--radius-sm);
            color: #fff;
            padding: 10px 12px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .quick-input:focus {
            border-color: var(--sky);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }

        .btn-quick-confirm {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
        }

        .btn-quick-confirm:active {
            transform: scale(0.97);
        }

        /* STATUS FILTER BAR */
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-pill.active {
            background: var(--sky);
            border-color: var(--sky);
            color: #04101e;
        }

        /* DELIVERIES GRID */
        .deliveries-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .delivery-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, border-color 0.15s;
        }

        .delivery-card:before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--sky);
        }

        .delivery-card.delivered {
            opacity: 0.85;
            border-color: rgba(16, 185, 129, 0.4);
        }

        .delivery-card.delivered:before {
            background: var(--success);
        }

        .delivery-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .delivery-code-pill {
            background: rgba(56, 189, 248, 0.18);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: var(--sky);
            font-weight: 800;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .delivery-receipt-text {
            font-size: 11px;
            color: var(--text-dim);
            font-family: Consolas, monospace;
        }

        .delivery-status-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .delivery-status-tag.on-the-way {
            background: rgba(56, 189, 248, 0.15);
            color: var(--sky);
            border: 1px solid rgba(56, 189, 248, 0.35);
        }

        .delivery-status-tag.completed {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .delivery-info-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
        }

        .delivery-info-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .info-icon {
            font-size: 14px;
            opacity: 0.9;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .phone-link {
            color: var(--sky);
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .map-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            margin-left: 6px;
            background: rgba(96, 165, 250, 0.12);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .delivery-items-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .delivery-items-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .delivery-item-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .delivery-item-row b {
            color: #fff;
        }

        .delivery-total-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 6px;
            margin-top: 4px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            font-size: 13px;
            font-weight: 700;
        }

        .btn-complete-delivery {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            padding: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
        }

        .btn-complete-delivery:active {
            transform: scale(0.98);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { background: #065f46; border: 1px solid #10b981; }
        .toast.error { background: #7f1d1d; border: 1px solid #ef4444; }
        .toast.warning { background: #78350f; border: 1px solid #f59e0b; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- TOP HEADER -->
    <header>
        <div class="brand">
            <div class="brand-logo">🛵</div>
            <div class="brand-text">
                <h1 id="restaurantName">BAKU LOUNGE DELIVERY</h1>
                <p><span class="live-dot"></span> Canlı Kuryer Portalı</p>
            </div>
        </div>

        <div>
            <a href="index.html" class="switch-link-btn">🍽️ Ofisiant Portalı →</a>
        </div>
    </header>

    <!-- TOAST -->
    <div id="toast" class="toast">Bildiriş</div>

    <!-- MAIN VIEW -->
    <main>
        <!-- FILTER & CONTROLS -->
        <div class="courier-controls-card">
            <div class="control-row">
                <select id="courierSelect" class="courier-select" onchange="onCourierFilterChange()">
                    <option value="">🛵 Bütün Kuryerlər</option>
                </select>
                <button class="btn-refresh" onclick="loadDeliveries()">🔄 Yenilə</button>
            </div>

            <div class="quick-confirm-bar">
                <input type="text" id="quickCodeInput" class="quick-input" placeholder="Sifariş kodu (məs: 1042) və ya Çek №..." onkeydown="if(event.key==='Enter') quickConfirmDelivery()" />
                <button class="btn-quick-confirm" onclick="quickConfirmDelivery()">✅ Təsdiqlə</button>
            </div>
        </div>

        <!-- STATUS TABS -->
        <div class="filter-bar">
            <div class="filter-pill active" id="pillAll" onclick="setStatusFilter('all')">Hamısı (<span id="countAll">0</span>)</div>
            <div class="filter-pill" id="pillActive" onclick="setStatusFilter('active')">🛵 Yoldadır (<span id="countActive">0</span>)</div>
            <div class="filter-pill" id="pillDelivered" onclick="setStatusFilter('delivered')">✅ Çatdırılıb (<span id="countDelivered">0</span>)</div>
        </div>

        <!-- DELIVERIES LIST -->
        <div class="deliveries-grid" id="deliveriesGrid">
            <!-- Injected via JavaScript -->
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://budfynvawccdjgeqmokb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1ZGZ5bnZhd2NjZGpnZXFtb2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTIzMzAsImV4cCI6MjEwNjU4ODMzMH0.6Dh4b2IanO8XUshfQAcWa9dAhEgOe8clNQwI82RQ36A";

        let sb = null;
        try {
            if (window.supabase) {
                sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        const isCloud = window.location.hostname.includes('github.io') ||
                        (!window.location.hostname.startsWith('192.168.') &&
                         window.location.hostname !== 'localhost' &&
                         window.location.hostname !== '127.0.0.1');

        let allDeliveries = [];
        let allCouriersList = [];
        let selectedCourierFilter = '';
        let currentStatusFilter = 'all'; // 'all', 'active', 'delivered'

        window.addEventListener('DOMContentLoaded', async () => {
            await loadCouriers();
            await loadDeliveries();
            startRealtimeAndPolling();
        });

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        async function loadCouriers() {
            if (sb) {
                try {
                    const { data, error } = await sb.from('couriers').select('*').order('full_name');
                    if (data && data.length > 0) {
                        allCouriersList = data.map(c => ({
                            id: c.id,
                            fullName: c.full_name,
                            phoneNumber: c.phone_number,
                            vehiclePlate: c.vehicle_plate,
                            standardFee: Number(c.standard_fee) || 0
                        }));
                        renderCourierOptions();
                        return;
                    }
                } catch (e) { }
            }

            try {
                const res = await fetch('/api/couriers');
                if (res.ok) {
                    allCouriersList = await res.json();
                    renderCourierOptions();
                }
            } catch (e) { }
        }

        function renderCourierOptions() {
            const select = document.getElementById('courierSelect');
            if (!select) return;
            const currentVal = select.value;
            select.innerHTML = '<option value="">🛵 Bütün Kuryerlər</option>';
            allCouriersList.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.fullName;
                opt.textContent = `🛵 ${c.fullName} ${c.vehiclePlate ? '(' + c.vehiclePlate + ')' : ''}`;
                select.appendChild(opt);
            });
            if (currentVal) select.value = currentVal;
        }

        function onCourierFilterChange() {
            const select = document.getElementById('courierSelect');
            selectedCourierFilter = select ? select.value : '';
            loadDeliveries();
        }

        function setStatusFilter(status) {
            currentStatusFilter = status;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            if (status === 'all') document.getElementById('pillAll').classList.add('active');
            else if (status === 'active') document.getElementById('pillActive').classList.add('active');
            else if (status === 'delivered') document.getElementById('pillDelivered').classList.add('active');
            renderDeliveries();
        }

        async function loadDeliveries() {
            if (sb) {
                try {
                    let q = sb.from('orders')
                        .select('*')
                        .eq('order_type', 'Delivery')
                        .order('created_at', { ascending: false })
                        .limit(80);
                    if (selectedCourierFilter) {
                        q = q.eq('courier_name', selectedCourierFilter);
                    }
                    const { data, error } = await q;
                    if (data) {
                        allDeliveries = data.map(d => {
                            const recNum = d.receipt_number || '';
                            const ordCode = d.order_code || (recNum.length >= 4 ? recNum.slice(-4) : recNum) || '';
                            return {
                                orderId: d.id,
                                orderCode: ordCode,
                                receiptNumber: recNum,
                                customerName: d.customer_name || 'Müştəri',
                                customerPhone: d.customer_phone || '',
                                address: d.delivery_address || 'Ünvan qeyd olunmayıb',
                                notes: d.delivery_notes || '',
                                courierName: d.courier_name || 'Təyin edilməyib',
                                courierPhone: d.courier_phone || '',
                                courierVehicle: d.courier_vehicle || '',
                                deliveryFee: Number(d.delivery_fee) || 0,
                                totalAmount: Number(d.grand_total || d.subtotal) || 0,
                                paymentMethod: d.payment_method || 'Nağd',
                                status: d.status,
                                isDelivered: d.status === 'Delivered',
                                items: Array.isArray(d.items) ? d.items : [],
                                createdAt: d.created_at
                            };
                        });
                        renderDeliveries();
                        updateCounts();
                        return;
                    }
                } catch (e) {
                    console.error('Supabase loadDeliveries error:', e);
                }
            }

            try {
                let url = '/api/deliveries';
                if (selectedCourierFilter) {
                    url += '?courier=' + encodeURIComponent(selectedCourierFilter);
                }
                const res = await fetch(url);
                if (res.ok) {
                    allDeliveries = await res.json();
                    renderDeliveries();
                    updateCounts();
                }
            } catch (e) { }
        }

        function updateCounts() {
            const total = allDeliveries.length;
            const active = allDeliveries.filter(d => !d.isDelivered).length;
            const delivered = allDeliveries.filter(d => d.isDelivered).length;

            const cAll = document.getElementById('countAll');
            const cAct = document.getElementById('countActive');
            const cDel = document.getElementById('countDelivered');

            if (cAll) cAll.textContent = total;
            if (cAct) cAct.textContent = active;
            if (cDel) cDel.textContent = delivered;
        }

        function renderDeliveries() {
            const grid = document.getElementById('deliveriesGrid');
            if (!grid) return;
            grid.innerHTML = '';

            let filtered = allDeliveries;
            if (currentStatusFilter === 'active') {
                filtered = allDeliveries.filter(d => !d.isDelivered);
            } else if (currentStatusFilter === 'delivered') {
                filtered = allDeliveries.filter(d => d.isDelivered);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🛵</div>
                        <h3 style="font-size:16px; color:#fff; margin-bottom:4px;">Sifariş Tapılmadı</h3>
                        <p style="font-size:12px; color:var(--text-muted);">Seçilmiş filtrə uyğun çatdırılma sifarişi yoxdur.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(d => {
                const card = document.createElement('div');
                card.className = 'delivery-card' + (d.isDelivered ? ' delivered' : '');

                const orderCodeDisplay = d.orderCode ? `#${escapeHtml(d.orderCode)}` : '';
                const timeStr = d.createdAt ? new Date(d.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                let statusBadge = `<span class="delivery-status-tag on-the-way">🛵 Yoldadır</span>`;
                if (d.isDelivered) {
                    statusBadge = `<span class="delivery-status-tag completed">✅ Çatdırılıb</span>`;
                }

                let itemsHtml = '';
                if (d.items && d.items.length > 0) {
                    itemsHtml = `
                        <div class="delivery-items-box">
                            <div class="delivery-items-title">📦 Sifariş Tərkibi (${d.items.length} növ məhsul):</div>
                            ${d.items.map(it => `
                                <div class="delivery-item-row">
                                    <span>${escapeHtml(it.productName)} × <b>${it.quantity}</b></span>
                                    <span>${formatCurrency(it.totalPrice || (it.unitPrice * it.quantity))}</span>
                                </div>
                            `).join('')}
                            <div class="delivery-total-bar">
                                <span>Cəmi Ödəniş:</span>
                                <span style="color:var(--gold); font-size:15px;">${formatCurrency(d.totalAmount)}</span>
                            </div>
                        </div>
                    `;
                }

                const mapQuery = encodeURIComponent(d.address || '');

                card.innerHTML = `
                    <div class="delivery-header">
                        <div style="display:flex; align-items:center; gap:8px;">
                            ${orderCodeDisplay ? `<span class="delivery-code-pill">KOD: ${orderCodeDisplay}</span>` : ''}
                            <span class="delivery-receipt-text">${escapeHtml(d.receiptNumber)}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span style="font-size:11px; color:var(--text-dim);">${timeStr}</span>
                            ${statusBadge}
                        </div>
                    </div>

                    <div class="delivery-info-section">
                        <div class="delivery-info-row">
                            <span class="info-icon">👤</span>
                            <div>
                                <span style="font-weight:700; color:#fff;">${escapeHtml(d.customerName || 'Müştəri')}</span>
                                ${d.customerPhone ? ` • <a href="tel:${escapeHtml(d.customerPhone)}" class="phone-link">📞 ${escapeHtml(d.customerPhone)}</a>` : ''}
                            </div>
                        </div>
                        <div class="delivery-info-row">
                            <span class="info-icon">📍</span>
                            <div>
                                <span style="color:var(--text-muted);">${escapeHtml(d.address || 'Ünvan qeyd olunmayıb')}</span>
                                ${d.address ? `<a href="https://maps.google.com/?q=${mapQuery}" target="_blank" class="map-link">🗺️ Xəritədə Aç</a>` : ''}
                            </div>
                        </div>
                        ${d.notes ? `
                        <div class="delivery-info-row">
                            <span class="info-icon">📝</span>
                            <div style="color:#93c5fd; font-style:italic;">${escapeHtml(d.notes)}</div>
                        </div>` : ''}
                        <div class="delivery-info-row">
                            <span class="info-icon">🛵</span>
                            <div>Kuryer: <b>${escapeHtml(d.courierName || 'Təyin edilməyib')}</b> ${d.courierPhone ? `(${escapeHtml(d.courierPhone)})` : ''} ${d.courierVehicle ? `[${escapeHtml(d.courierVehicle)}]` : ''}</div>
                        </div>
                        <div class="delivery-info-row">
                            <span class="info-icon">💳</span>
                            <div>Ödəniş növü: <b>${escapeHtml(d.paymentMethod || 'Nağd')}</b> ${d.deliveryFee > 0 ? `(Çatdırılma: ${formatCurrency(d.deliveryFee)})` : ''}</div>
                        </div>
                    </div>

                    ${itemsHtml}

                    ${!d.isDelivered ? `
                        <button class="btn-complete-delivery" onclick="completeDelivery('${d.orderId}', '${escapeHtml(d.orderCode || '')}', '${escapeHtml(d.receiptNumber)}')">
                            <span>✅ SİFARİŞİ TƏHVİL VERDİM (ÇATDIRILDI)</span>
                        </button>
                    ` : ''}
                `;

                grid.appendChild(card);
            });
        }

        async function completeDelivery(orderId, code, receiptNumber) {
            const select = document.getElementById('courierSelect');
            const courierName = select && select.value ? select.value : 'Kuryer';

            if (!confirm(`Sifariş #${code || receiptNumber} müştəriyə təhvil verildi olaraq təsdiqlənsin?`)) {
                return;
            }

            let success = false;

            if (sb) {
                try {
                    let q = sb.from('orders').update({
                        status: 'Delivered',
                        updated_at: new Date().toISOString()
                    });
                    if (orderId && orderId !== 'undefined' && orderId !== 'null') {
                        q = q.eq('id', orderId);
                    } else if (code) {
                        q = q.eq('order_code', code);
                    } else if (receiptNumber) {
                        q = q.eq('receipt_number', receiptNumber);
                    }
                    const { error } = await q;
                    if (!error) success = true;
                } catch (e) {
                    console.error('Supabase complete delivery error:', e);
                }
            }

            try {
                const res = await fetch('/api/delivery/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: orderId,
                        code: code,
                        receiptNumber: receiptNumber,
                        courierName: courierName
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.success) success = true;
                }
            } catch (e) { }

            if (success || sb) {
                showToast('Çatdırılma uğurla tamamlandı! 🎉', 'success');
                await loadDeliveries();
            } else {
                showToast('Əlaqə xətası baş verdi', 'error');
            }
        }

        async function quickConfirmDelivery() {
            const input = document.getElementById('quickCodeInput');
            if (!input || !input.value.trim()) {
                showToast('Sifariş kodunu və ya çek nömrəsini yazın!', 'warning');
                return;
            }

            const codeVal = input.value.trim();
            const select = document.getElementById('courierSelect');
            const courierName = select && select.value ? select.value : 'Kuryer';

            let success = false;

            if (sb) {
                try {
                    const { data, error } = await sb.from('orders')
                        .update({
                            status: 'Delivered',
                            courier_name: courierName,
                            updated_at: new Date().toISOString()
                        })
                        .or(`order_code.eq.${codeVal},receipt_number.eq.${codeVal}`);
                    if (!error) success = true;
                } catch (e) {
                    console.error(e);
                }
            }

            try {
                const res = await fetch('/api/delivery/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: codeVal,
                        courierName: courierName
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.success) success = true;
                }
            } catch { }

            showToast(`Kod #${codeVal} çatdırıldı!`, 'success');
            input.value = '';
            await loadDeliveries();
        }

        function startRealtimeAndPolling() {
            if (sb) {
                try {
                    sb.channel('courier-orders-channel')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
                            loadDeliveries();
                        })
                        .subscribe();
                } catch (e) {
                    console.error('Realtime subscription error:', e);
                }
            }

            setInterval(async () => {
                try {
                    await loadDeliveries();
                } catch (e) { }
            }, 3500);
        }

        function formatCurrency(amount) {
            const val = Number(amount) || 0;
            return val.toFixed(2) + ' ₼';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
